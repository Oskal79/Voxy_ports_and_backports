# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx6G

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon = false

# Minecraft / NeoForge
minecraft_version=26.1.2
neoforge_version=26.1.2.76
moddev_version=2.0.141

# Sodium is NOT built here -- voxy compiles against the official NeoForge release in
# .buildenv/ref-sodium/sodium-<version>.jar, which is the build you already run in your client.
#
# 0.9.1 is the newest Sodium for 26.1.2 that Iris <=1.11.3 works with: 0.9.2-alpha.* drops the
# RenderRegion.clearAllCachedBatches() call in RenderRegionManager.uploadResults that Iris
# @Redirects, which crashes on world load regardless of voxy. It is also the version voxy
# 0.2.18-beta is developed against upstream (branch 2612 pins mc26.1.2-0.9.1).
sodium_version=0.9.1
# NeoForge dependency range written into neoforge.mods.toml.
sodium_version_range=[0.9.1,0.9.3)

# Optional compile-time integrations (NeoForge builds of the mods Voxy integrates with)
iris_version=1.11.2+26.1-neoforge
lithium_version=mc26.1.2-0.24.6-neoforge
vivecraft_version=26.1.2-1.3.13-neoforge

# Mod Properties
mod_version = 0.2.18-beta
maven_group = me.cortex
archives_base_name = voxy
