# Voxy access transformer -- Minecraft 1.16.5 / Forge
#
# NOTE: ForgeGradle 5 applies access transformers against the SRG-named jar, so entries here
# must use SRG field names (field_xxx) even though the project compiles against the 'official'
# mapping channel. Writing the official name instead is silently accepted and widens nothing --
# the AT processor logs no error, so always verify with javap on the mapped jar afterwards.
