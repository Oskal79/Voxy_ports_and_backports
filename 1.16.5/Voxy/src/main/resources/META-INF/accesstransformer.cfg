# calling get(x,y,z) per block; both are non-public on 1.16.5's PalettedContainer.
# BitArray#getRaw/getSize and ArrayPalette/HashMapPalette#getSize are already public here, so
# unlike the 1.21.1 tree nothing else needs widening.

