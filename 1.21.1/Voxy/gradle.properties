# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx6G

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon = false

# Minecraft / NeoForge  (1.21.1 LTS line -- Java 21, not 25)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neoforge_version=21.1.248
neoforge_version_range=[21.1.0,)
moddev_version=2.0.141
java_version=21

# Sodium: NOT built here. Official NeoForge release jar kept in ../.buildenv/ref-sodium/
# as sodium-<sodium_version>.jar. This is the 1.21.1 LTS line.
sodium_version=1.21.1-0.8.13-beta.2
sodium_version_range=[0.8.13-beta,0.9)

# Optional compile-time integrations (NeoForge builds for 1.21.1)
iris_version=1.8.14-beta.1+1.21.1-neoforge
lithium_version=mc1.21.1-0.15.4-neoforge
vivecraft_version=1.21.1-1.3.15-neoforge

# LWJGL must match the version Minecraft ships, or Gradle cannot resolve a single org.lwjgl:lwjgl.
# 1.21.1 ships LWJGL 3.3.3 (26.x ships 3.4.1).
lwjgl_version=3.3.3
lwjgl_version_range=[3.3.3,3.4)

# Mod Properties
mod_version = 0.2.18-beta
maven_group = me.cortex
archives_base_name = voxy
